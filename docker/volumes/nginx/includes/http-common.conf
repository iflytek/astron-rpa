# Shared OpenResty HTTP configuration for both HTTPS and legacy HTTP modes.
resolver 127.0.0.11 valid=5s;

lua_package_path "/usr/local/openresty/lualib/?.lua;;;/usr/local/openresty/nginx/lua/?.lua;;";
lua_shared_dict my_cache 10m;

error_log /usr/local/openresty/nginx/logs/error.log error;

upstream resource-service {
    server resource-service:8030;
    keepalive 32;
}

upstream robot-service {
    server robot-service:8040;
    keepalive 32;
}

upstream ai-service {
    server ai-service:8010;
    keepalive 32;
}

upstream openapi-service {
    server openapi-service:8020;
    keepalive 32;
}

upstream rpa-auth-service {
    server rpa-auth:10251;
    keepalive 32;
}

upstream casdoor {
    server casdoor:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Never include query parameters or Referer in the access log. This preserves
# the sensitive-log protections for legacy URL credentials and other secrets.
log_format sanitized_access '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent" request_time=$request_time';
