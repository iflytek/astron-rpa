# Resource service routes.
location /api/resource/ {
    access_by_lua_file lua/auth_handler.lua;

    proxy_pass http://resource-service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# Robot service routes remain unauthenticated here to avoid a recursive call
# through the authentication service. More granular authorization belongs to
# the application route and is outside the TLS deployment boundary.
location /api/robot/ {
    proxy_pass http://robot-service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /api/rpa-ai-service/ {
    access_by_lua_file lua/auth_handler.lua;

    rewrite ^/api/rpa-ai-service/(.*)$ /$1 break;
    proxy_pass http://ai-service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# MCP Streamable HTTP uses its own API-key authentication in openapi-service.
location ~ ^/api/rpa-openapi/mcp/?$ {
    rewrite ^/api/rpa-openapi/mcp/?(.*)$ /mcp/$1 break;
    proxy_pass http://openapi-service;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location /api/rpa-openapi/ws {
    set $context_type "WebSocket";
    access_by_lua_file lua/auth_handler.lua;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    rewrite ^/api/rpa-openapi/(.*)$ /$1 break;
    proxy_pass http://openapi-service;
}

location /api/rpa-openapi/ {
    access_by_lua_file lua/auth_handler.lua;

    rewrite ^/api/rpa-openapi/(.*)$ /$1 break;
    proxy_pass http://openapi-service;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location /api/rpa-auth/ {
    proxy_pass http://rpa-auth-service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /api/casdoor/ {
    rewrite ^/api/casdoor/(.*)$ /$1 break;
    proxy_pass http://casdoor;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

location /favicon.ico {
    access_log off;
    return 204;
}

location / {
    return 404 "Not Found";
}
