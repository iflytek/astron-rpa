    /*  紫色粒子专属动画：旋转 + 停顿  */
    /* ========================================= */

    /* 1. 定义关键帧：动 1 秒，歇 4 秒的感觉 */
    @keyframes spin-pause {
    0% { 
        transform: rotate(0deg) scale(1); 
    }
    10% { 
        /* 快速旋转 180 度，同时稍微放大一点点，增加Q弹感 */
        transform: rotate(180deg) scale(1.2); 
    }
    20% {
        /* 回到原大小，保持旋转角度 */
        transform: rotate(180deg) scale(1); 
    }
    100% { 
        /* 剩下的 80% 时间保持不动，直到下一次循环 */
        transform: rotate(180deg) scale(1); 
    }
    }

    /* 流动光效 - 使用 SMIL 动画渐变，不需要 CSS 动画 */

    /* 2. 粒子通用设置 */
    #particle-top-left, 
    #particle-top-right, 
    #particle-bottom {
    /* 关键：确保旋转是围绕自身中心，而不是围绕画布左上角 */
    transform-box: fill-box;
    transform-origin: center;
    }

