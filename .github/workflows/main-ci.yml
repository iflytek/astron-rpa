name: Main CI Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write

concurrency:
  group: main-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Check which paths were changed to determine which tests to run
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      engine-changed: ${{ steps.changes.outputs.engine }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      deployment-changed: ${{ steps.changes.outputs.deployment }}
      integration-changed: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            engine:
              - 'engine/**'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/robot-service/**'
              - 'backend/resource-service/**'
            deployment:
              - 'docker/**'
              - 'backend/rpa-auth/src/main/java/com/iflytek/rpa/auth/conf/SessionConfig.java'
              - 'backend/rpa-auth/src/main/resources/application-casdoor.yml'
              - 'backend/rpa-auth/src/test/java/com/iflytek/rpa/auth/conf/SessionConfigTest.java'
              - '.github/workflows/main-ci.yml'
            integration:
              - 'backend/openapi-service/**'
              - 'backend/ai-service/**'
              - 'integrations/n8n/**'
              - 'engine/shared/**'
              - 'engine/servers/astronverse-scheduler/**'
              - 'engine/servers/astronverse-executor/**'
              # n8n also checks the inventory of all component directories.
              - 'engine/components/**'
              - 'engine/pyproject.toml'
              - 'engine/uv.lock'
              - '.github/scripts/run-integration-regression.py'
              - '.github/scripts/test-ci-summary.py'
              - '.github/scripts/*n8n-audit.cjs'
              - '.github/workflows/integration-regression.yml'
              - '.github/workflows/publish-n8n.yml'
              - '.github/workflows/main-ci.yml'

  # Run tests in parallel
  style-check:
    name: Style Check
    uses: ./.github/workflows/style.yml
    needs: check-changes
    if: |
      needs.check-changes.outputs.engine-changed == 'true' ||
      needs.check-changes.outputs.frontend-changed == 'true' ||
      needs.check-changes.outputs.backend-changed == 'true'

  deployment-security-test:
    name: HTTPS Deployment Security Test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.deployment-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Test OpenResty configuration renderer
        run: sh docker/tests/test-render-config.sh
      - name: Test Compose and OpenResty configurations
        run: sh docker/tests/test-nginx-config.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/rpa-auth/pom.xml
      - name: Test secure session cookie configuration
        working-directory: backend/rpa-auth
        run: mvn -B -DskipTests=false -Dtest=SessionConfigTest test

  integration-regression:
    name: Integration Regression
    uses: ./.github/workflows/integration-regression.yml
    needs: check-changes
    if: needs.check-changes.outputs.integration-changed == 'true'
    permissions:
      contents: read

  # ============================================================================
  # Summary Stage
  # ============================================================================
  summary:
    name: 📊 CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [check-changes, style-check, deployment-security-test, integration-regression]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Generate CI Summary
        run: |
          echo "=== 🚀 Astron RPA CI Pipeline Summary ==="
          echo ""
          echo "📁 Changed Components:"
          echo "  🔧 Engine: ${{ needs.check-changes.outputs.engine-changed }}"
          echo "  🎨 Frontend: ${{ needs.check-changes.outputs.frontend-changed }}"
          echo "  ⚙️ Backend: ${{ needs.check-changes.outputs.backend-changed }}"
          echo "  🔒 Deployment: ${{ needs.check-changes.outputs.deployment-changed }}"
          echo "  🧪 Integration: ${{ needs.check-changes.outputs.integration-changed }}"
          echo ""
          echo "🔍 Job Results:"
          echo "  📋 Change Detection: ${{ needs.check-changes.result }}"
          echo "  ✨ Style Check: ${{ needs.style-check.result }}"
          echo "  🔒 HTTPS Deployment Security Test: ${{ needs.deployment-security-test.result }}"
          echo "  🧪 Integration Regression: ${{ needs.integration-regression.result }}"
          echo ""

          # Determine overall status
          overall_success=true
          
          # Check required jobs
          if [[ "${{ needs.check-changes.result }}" != "success" ]]; then
            echo "❌ Change detection failed"
            overall_success=false
          fi
          
          # Match the style-check scheduling condition, including frontend/backend.
          if [[ "${{ needs.check-changes.outputs.engine-changed }}" == "true" ||
                "${{ needs.check-changes.outputs.frontend-changed }}" == "true" ||
                "${{ needs.check-changes.outputs.backend-changed }}" == "true" ]]; then
            if [[ "${{ needs.style-check.result }}" != "success" ]]; then
              echo "❌ Style check failed"
              overall_success=false
            fi
          else
            echo "ℹ️ Style check skipped (no engine/frontend/backend changes)"
          fi

          if [[ "${{ needs.check-changes.outputs.deployment-changed }}" == "true" ]]; then
            if [[ "${{ needs.deployment-security-test.result }}" != "success" ]]; then
              echo "❌ HTTPS deployment security test failed"
              overall_success=false
            fi
          else
            echo "ℹ️ HTTPS deployment security test skipped (no deployment changes)"
          fi

          if [[ "${{ needs.check-changes.outputs.integration-changed }}" == "true" ]]; then
            if [[ "${{ needs.integration-regression.result }}" != "success" ]]; then
              echo "❌ Integration regression failed, was cancelled, or was unexpectedly skipped"
              overall_success=false
            fi
          else
            echo "ℹ️ Integration regression skipped (no relevant changes)"
          fi

          echo ""
          if [[ "$overall_success" == "true" ]]; then
            echo "✅ 🎉 All checks passed! Ready for merge."
            echo "🚀 Your code looks great!"
          else
            echo "❌ 🚨 Some checks failed. Please review the logs above."
            echo "🔧 Fix the issues and push again."
            exit 1
          fi
