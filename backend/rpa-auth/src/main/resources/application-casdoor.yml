
spring:
#  autoconfigure:
#    exclude:
#      - com.iflytek.sec.uap.starter.UapClientAutoConfiguration
  servlet:
    multipart:
      max-request-size: 110MB
      max-file-size: 100MB
      file-size-threshold: 100MB
  redis:
    database: ${REDIS_DB}
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    pool:
      max-active: 200
      max-idle: 10
      max-wait: -1
      min-idle: 0
    timeout: 5000
  session:
    store-type: redis
    redis:
      flush-mode: on_save    # 每次响应结束刷到 Redis
      namespace: uap:session # key 前缀，避免冲突

  datasource:
    # RPA 业务数据库（主数据源）
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?serverTimezone=GMT%2B8&zeroDateTimeBehavior=round&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
    platform: mysql
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 1
    minIdle: 3
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 30000
    validationQuery: select 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    filters: stat,wall,slf4j
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000;druid.stat.logSlowSql=true;druid.stat.enabled=true
    # Casdoor 数据库（独立数据源）
    casdoor:
      url: jdbc:mysql://${CASDOOR_DATABASE_HOST}:${CASDOOR_DATABASE_PORT}/casdoor?serverTimezone=GMT%2B8&zeroDateTimeBehavior=round&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true
      username: ${CASDOOR_DATABASE_USERNAME}
      password: ${CASDOOR_DATABASE_PASSWORD}
      driverClassName: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

druid:
  initParams:
    loginUsername: admin
    loginPassword: 123456
    allows:
    denys:
    resetEnable: false


#日志相关配置
logging:
  level:
    org:
      springframework:
        boot:
          autoconfigure: info
  config: classpath:logback-delayed.xml

redis:
  open: "true"


#  允许配置在此处的地址跨域请求接口
#  前后端分离时如果前端的域和后端不一样，请将前端的域配置在此处,注意是域名或ip即可，不需要端口号
allowed:
  origins: localhost

# RPA 认证服务配置
rpa:
  auth:
    # 部署模式：saas | private-enterprise | private-uap | casdoor
    deployment-mode: casdoor
    # HTTPS deployments default to Secure session cookies. The explicit
    # legacy-http compose override sets this to false for migration only.
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}

casdoor:
  endpoint: ${CASDOOR_ENDPOINT}
  # 用于外部访问的endpoint，返回给前端的登录地址使用（服务器IP或公网域名）
  external-endpoint: ${CASDOOR_EXTERNAL_ENDPOINT}
  client-id: ${CASDOOR_CLIENT_ID}
  client-secret: ${CASDOOR_CLIENT_SECRET}
  # Optional public certificate for SDK JWT verification; never use a shared bootstrap key.
  certificate: ${CASDOOR_CERTIFICATE:}
  organization-name: ${CASDOOR_ORGANIZATION_NAME}
  application-name: ${CASDOOR_APPLICATION_NAME}
  redirect-url: ${CASDOOR_REDIRECT_URL}
  database:
    name: casdoor
