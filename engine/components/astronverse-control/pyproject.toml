[project]
name = "astronverse-control"
version = "1.0.0"
description = "astronverse-control flow components."
requires-python = ">=3.13"

dependencies = [
    "astronverse-actionlib",
    "matplotlib",
    "pandas",
    "seaborn",
    "python-pptx>=0.6.21",
    "skia-pathops>=0.9.2",
    "uharfbuzz>=0.50.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "svglib>=1.5.0",
    "reportlab>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.7.0",
    "mammoth>=1.6.0",
    "markdownify>=0.11.6",
    "ebooklib>=0.18",
    "nbconvert>=7.0.0",
    "google-genai>=1.0.0",
    "edge-tts>=7.2.8",
    "defusedxml",
    "lxml",
]

[tool.uv.sources]
astronverse-actionlib = {path = "../../shared/astronverse-actionlib", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/astronverse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
