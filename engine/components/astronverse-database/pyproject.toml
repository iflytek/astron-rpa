[project]
name = "astronverse-database"
version = "1.0.1"
description = "astronverse-database."
requires-python = ">=3.13"

dependencies = [
    "astronverse-actionlib",
    "pymysql"
]

# Native drivers are installed only for the database used by a workflow.
# SQLite uses the standard library; MySQL is available in the packaged client.
[project.optional-dependencies]
sqlserver = ["pyodbc"]
access = ["pyodbc"]
oracle = ["cx_Oracle"]
postgresql = ["psycopg2-binary"]

[tool.uv.sources]
astronverse-actionlib = {path = "../../shared/astronverse-actionlib", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/astronverse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
