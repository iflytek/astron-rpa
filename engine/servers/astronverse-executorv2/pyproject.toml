[project]
name = "astronverse-executor"
version = "1.0.1"
description = "astronverse-executor."
requires-python = ">=3.13"

dependencies = [
    "websockets",
    "psutil",
    "anyio",
    "requests",
    "importlib_metadata",
    "astronverse-baseline",
    "astronverse-actionlib",
    "astronverse-websocket-server",
    "astronverse-tools",
    "astronverse-browser",
    "astronverse-input",
    "astronverse-openapi",
    "astronverse-pdf",
    "astronverse-report",
    "astronverse-verifycode",
    "astronverse-vision",
    "astronverse-script",
    "astronverse-software",
    "astronverse-system",
    "astronverse-database",
    "astronverse-dataprocess",
    "astronverse-dialog",
    "astronverse-email",
    "astronverse-encrypt",
    "astronverse-enterprise",
    "astronverse-excel",
    "astronverse-window",
    "astronverse-winelement",
    "astronverse-word",
    "astronverse-workflowlib"
]

[tool.uv.sources]
astronverse-baseline = {path = "../../shared/astronverse-baseline", editable = true}
astronverse-actionlib = {path = "../../shared/astronverse-actionlib", editable = true}
astronverse-websocket-server = {path = "../../shared/astronverse-websocket-server", editable = true}
astronverse-tools = {path = "../../shared/astronverse-tools", editable = true}
astronverse-workflowlib = {path = "../../shared/astronverse-workflowlib", editable = true}

astronverse-browser = {path = "../../components/astronverse-browser", editable = true}
astronverse-input = {path = "../../components/astronverse-input", editable = true}
astronverse-openapi = {path = "../../components/astronverse-openapi", editable = true}
astronverse-pdf = {path = "../../components/astronverse-pdf", editable = true}
astronverse-report = {path = "../../components/astronverse-report", editable = true}
astronverse-verifycode = {path = "../../components/astronverse-verifycode", editable = true}
astronverse-vision = {path = "../../components/astronverse-vision", editable = true}
astronverse-script = {path = "../../components/astronverse-script", editable = true}
astronverse-software = {path = "../../components/astronverse-software", editable = true}
astronverse-system = {path = "../../components/astronverse-system", editable = true}
astronverse-database = {path = "../../components/astronverse-database", editable = true}
astronverse-dataprocess = {path = "../../components/astronverse-dataprocess", editable = true}
astronverse-dialog = {path = "../../components/astronverse-dialog", editable = true}
astronverse-email = {path = "../../components/astronverse-email", editable = true}
