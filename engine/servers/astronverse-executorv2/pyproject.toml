astronverse-window = {path = "../../components/astronverse-window", editable = true}
astronverse-winelement = {path = "../../components/astronverse-winelement", editable = true}
astronverse-word = {path = "../../components/astronverse-word", editable = true}


[tool.hatch.build.targets.wheel]
packages = ["src/astronverse"]

[build-system]
